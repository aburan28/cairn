# Weekly, not daily: this project pins its lockfile (`--locked` in CI) and a
# dependency bump is a reviewed change like any other, so batching them beats
# a trickle of single-crate PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the whole RustCrypto set, because these crates share the
      # `digest`, `crypto-common`, `aead` and `rand_core` traits and a major
      # only makes sense alongside its peers. Split across PRs they merge
      # individually and green -- each resolves fine on its own -- and break at
      # the type level where two versions of a trait meet. That is what took
      # `main` down in four files: `hmac 0.13` against `sha2 0.10`,
      # `x25519-dalek 3` and `chacha20poly1305 0.11` against `rand_core 0.6`.
      # Grouped, the incompatibility shows up in one PR's own CI, which is
      # where it can be dealt with.
      rustcrypto:
        patterns:
          - "sha2"
          - "hmac"
          - "digest"
          - "crypto-common"
          - "aead"
          - "cipher"
          - "chacha20poly1305"
          - "poly1305"
          - "universal-hash"
          - "rand_core"
          - "x25519-dalek"
          - "ed25519-dalek"
          - "curve25519-dalek"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Not an action version -- the `msrv` job pins this to the crate's
      # *claimed* `rust-version` (see Cargo.toml and the job's own comment) so
      # that job means something. Dependabot reads `dtolnay/rust-toolchain@X.Y.Z`
      # the same way it reads any other `uses:` tag and offers to bump it to the
      # latest toolchain release, which would make the MSRV job stop checking
      # MSRV. Every other `dtolnay/rust-toolchain` reference in this repo floats
      # on `@stable` and is unaffected by this ignore.
      - dependency-name: "dtolnay/rust-toolchain"

  # The reference implementation is its own workspace with its own lockfile, so
  # the entry above does not reach it. Watched separately rather than folded in:
  # it deliberately depends on almost nothing (sha2 and ed25519-dalek), and an
  # independent check that quietly drifted onto the primary's dependency tree
  # would stop being independent.
  - package-ecosystem: cargo
    directory: /reference/rust
    schedule:
      interval: weekly
