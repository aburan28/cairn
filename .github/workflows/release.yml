name: release

# Tag builds, plus a manual trigger. `--locked` because a release built from an
# unlocked dependency resolution is a release nobody can reproduce.
#
# Tags are cut by `release-please.yml`, not by hand: that workflow owns the
# version and the changelog, this one owns the binaries. The split is
# deliberate — deciding *what version this is* and *what bytes ship* are
# different jobs with different failure modes, and a tool that does both tends
# to do one of them badly.
#
# `workflow_dispatch` does two jobs, and which one depends on the ref it is
# given.
#
# On a **branch** it is a dry run. This workflow had never run once: releases
# only fire on tags, so a break in it stays invisible until the moment somebody
# is trying to cut a release and least wants to debug YAML. Dispatching builds,
# packages and installs everything without publishing, so the path can be
# exercised on demand -- and it is the only thing that exercises the .deb, the
# .rpm and the .dmg, so dispatch it on any branch that touches `packaging/`.
#
# On a **tag** it is how every release is actually built. `release-please.yml`
# cuts the tag with its GITHUB_TOKEN, GitHub starts no workflow for anything
# that token does, and so `on: push: tags` below has never fired for a release
# -- that file's last step has the whole story. It dispatches this workflow at
# the tag instead, which makes `github.ref` the tag and everything below behave
# as it would for a push. `push: tags` stays for a tag pushed by a person.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The jobs that upload or edit the release ask for
# `contents: write` themselves; `ui` and `updates-key`, which run npm and
# Homebrew, never hold it.
permissions:
  contents: read

env:
  # `github.ref_name` is the *branch* on a dry run, and a branch name may
  # contain a slash -- which lands in a tarball filename and makes
  # `tar -czf cairn-feat/thing-....tar.gz` write into a directory that
  # does not exist. The dry run this trigger exists for therefore failed at
  # the packaging step on any branch named the way this repository names
  # them, which is the one thing it was added to prove would not happen.
  #
  # A dry run also is not a version, so it gets a name no one can mistake
  # for one. Tags are unaffected and keep their own name.
  #
  # Here rather than on one job because four jobs now spell file names with
  # it, and they have to spell them identically: a package job finds the
  # tarball it wraps by this name.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-dispatch.{0}', github.run_id) }}

jobs:
  # The embedded reader, built once.
  #
  # `next build` output is plain files with no architecture in them, so building
  # it inside the six-way matrix would run the same Node toolchain six times to
  # produce six identical directories — and worse, would let two targets ship
  # different bytes if a dependency floated between jobs. One build, one
  # artifact, downloaded by every target.
  #
  # `npm ci` and not `npm install`, so the lockfile decides. A release whose UI
  # came from whatever npm resolved that morning is a release nobody can
  # reproduce, which is the same reason the Rust build passes `--locked`.
  ui:
    name: reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # An export that produced no index is a build that failed without saying
      # so, and `build.rs` would happily embed the rest of it.
      - name: the export has an entry point
        run: test -f ui/out/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: ui-out
          path: ui/out
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: ui
    strategy:
      # One target's toolchain failing should not hide whether the others
      # packaged. On a release that is the difference between "ship five of six
      # and fix one" and "ship nothing and guess which broke".
      fail-fast: false
      matrix:
        include:
          # --- Linux, native runners per architecture -------------------------
          #
          # Native rather than cross-compiled, everywhere it is possible. A
          # cross-built binary is only as trustworthy as the sysroot it was
          # linked against, and the arm64 runner is free on public
          # repositories, so there is nothing to buy by cross-compiling.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          # --- macOS ----------------------------------------------------------
          - os: macos-latest        # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-15-intel      # the last Intel image
            target: x86_64-apple-darwin
          #
          # No Windows target, and that is a decision rather than an oversight.
          # `src/verifiers`, `src/blobs.rs`, `src/store/{quota,atrest}.rs` and
          # the binary reach for `std::os::unix` and the seatbelt/bubblewrap
          # sandbox; shipping a Windows build would mean porting the sandbox,
          # and a node that verifies objective-authored code *without* one is
          # the configuration `CAIRN_REQUIRE_SANDBOX` exists to refuse.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned by commit, as every third-party action in a job holding a
      # write token is. A pinned rust-toolchain reads the toolchain from
      # `toolchain:` rather than from the ref.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # musl links statically, which is the point of shipping it: a node
      # operator on a distribution older than the runner's glibc gets a binary
      # that runs, instead of a symbol-version error.
      #
      # A linker is all this needs, and that was checked rather than assumed:
      # no crate in the locked graph has a build script that compiles C — no
      # `cc`, no `cmake`, no bindgen — and neither OpenSSL nor `ring` is in the
      # tree at all, the crypto here being pure-Rust RustCrypto plus
      # `classic-mceliece-rust`. `sha3` can compile assembly, but only behind
      # its non-default `asm` feature, which nothing here enables. If that ever
      # changes, this step is where it will surface.
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Into `ui/out`, which is where `build.rs` looks. The feature is on for
      # every release build: an operator who downloaded a tarball should be able
      # to read their own node's chain without installing Node, and that is the
      # entire reason the reader is embedded rather than shipped beside it.
      - uses: actions/download-artifact@v8
        with:
          name: ui-out
          path: ui/out

      # `build.rs` only warns when the export is missing, so that clippy, the
      # test suite, rustdoc and the MSRV check keep working without a Node
      # toolchain. A *release* is the one place that must not ship a binary
      # whose /ui/ 404s, so the requirement is asserted here instead.
      - name: the reader is present before the binaries are built
        run: test -f ui/out/index.html

      - run: cargo build --release --locked --features ui --target ${{ matrix.target }}

      # One binary. The CLI, the MCP server, the p2p daemon, the HTTP publisher
      # and the bootstrap generator are subcommands of it, so a node operator
      # cannot mix versions between them -- which is what shipping five separate
      # executables used to invite.
      #
      # The loop stays, with one entry: it fails on a missing binary rather
      # than quietly packaging an empty tarball. When there were five,
      # `gen-bootstrap` was left out for a while and the shipped README told
      # operators to run something the release did not contain.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="cairn-${VERSION}-${{ matrix.target }}"
          DIR="target/${{ matrix.target }}/release"
          BINS="cairn"
          for bin in $BINS; do
            [ -x "$DIR/$bin" ] || { echo "release is missing $bin" >&2; exit 1; }
          done
          tar -C "$DIR" -czf "$NAME.tar.gz" $BINS
          # A checksum beside the artifact, because this project's whole claim
          # is that you do not have to trust the party who served you the
          # bytes. Shipping binaries with no way to check them would be the one
          # inconsistency nobody could miss. `shasum` on macOS, `sha256sum` on
          # Linux — neither is present on both.
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          cat "$NAME.tar.gz.sha256"

      # Proof the thing that was just packaged actually runs on a clean unpack.
      # That is the failure a wrong-architecture build or a missing dynamic
      # library produces, and no other job in this repository would catch it,
      # because every other job runs binaries straight out of `target/`.
      #
      # Skipped when the runner cannot execute what it just built — nothing
      # here cross-compiles today, so this always runs, and the guard is here
      # so that adding a cross target later fails loudly rather than silently
      # skipping its only verification.
      - name: the unpacked binary runs
        shell: bash
        run: |
          set -euo pipefail
          NAME="cairn-${VERSION}-${{ matrix.target }}"
          mkdir -p /tmp/unpacked && tar -C /tmp/unpacked -xzf "$NAME.tar.gz"
          /tmp/unpacked/cairn --help >/dev/null 2>&1 \
            || { echo "cairn --help failed from the tarball" >&2; exit 1; }
          for SUB in mcp p2p serve gen-bootstrap arena run; do
            /tmp/unpacked/cairn $SUB --help >/dev/null 2>&1 \
              || { echo "cairn $SUB --help failed from the tarball" >&2; exit 1; }
          done
          # And one real end-to-end check, not just `--help`: the published log
          # ships in the repository, so a release can verify it the way a
          # downloader would. This is the strongest single statement a release
          # artifact can make about itself.
          /tmp/unpacked/cairn --log launch/cairn.jsonl --root . audit
          echo "unpacked binary runs and audits the published log"

          # The operator-facing path is `cairn run`, not a hand-assembled
          # `cairn p2p` invocation. Start the unpacked release against an empty
          # temporary store, ask the real HTTP listener for the embedded reader,
          # and drive its stdio MCP transport. This catches packaging mistakes
          # a compile alone cannot: a missing/mis-mounted UI or a launcher that
          # writes operational prose into the JSON-RPC stream.
          NODE_DATA="$(mktemp -d)"
          NODE_OUT="$(mktemp)"
          MCP_OUT="$(mktemp)"
          mkfifo "$NODE_DATA/mcp.in"
          "/tmp/unpacked/cairn" --data-dir "$NODE_DATA" run \
            <"$NODE_DATA/mcp.in" >"$MCP_OUT" 2>"$NODE_OUT" &
          NODE_PID=$!
          exec 9>"$NODE_DATA/mcp.in"
          cleanup_node() {
            exec 9>&- || true
            kill "$NODE_PID" 2>/dev/null || true
            wait "$NODE_PID" 2>/dev/null || true
            rm -rf "$NODE_DATA" "$NODE_OUT" "$MCP_OUT"
          }
          trap cleanup_node EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
                http://127.0.0.1:8080/ui/ >/tmp/cairn-release-ui.html; then
              break
            fi
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              cat "$NODE_OUT" >&2
              echo "cairn run exited before serving /ui/" >&2
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/cairn-release-ui.html
          grep -q "<html" /tmp/cairn-release-ui.html
          rm -f /tmp/cairn-release-ui.html
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' >&9
          for attempt in {1..60}; do
            grep -q '"id":1' "$MCP_OUT" && break
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              cat "$NODE_OUT" >&2
              echo "cairn run exited before answering MCP" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(wc -l < "$MCP_OUT")" -eq 1
          grep -q '^{"id":1,"jsonrpc":"2.0","result":{}}$' "$MCP_OUT"
          echo "cairn run serves the embedded UI and MCP"

      # v7. From v5 an artifact name may not be uploaded twice in a run, which
      # this matrix already satisfies -- one upload per target, and the target
      # is the name.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            cairn-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
            cairn-${{ env.VERSION }}-${{ matrix.target }}.tar.gz.sha256

      # Publishing is tag-only. A dry run builds, packages and proves the
      # tarball runs, then stops — so the path can be exercised without
      # minting a release nobody asked for.
      #
      # No `body:` here, and there used to be one. This step runs six times,
      # and each run *replaced* the release's text with the install
      # instructions -- which is how v1.2.0's page came to say how to install
      # it and nothing about what had changed: the changelog release-please
      # wrote was overwritten by the first target to finish. The `notes` job
      # at the end owns the release text now, once, and appends.
      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-upload.sh "$VERSION" "cairn-$VERSION-${{ matrix.target }}.tar.gz" "cairn-$VERSION-${{ matrix.target }}.tar.gz.sha256"

  # The installer, uploaded under a name with no version in it.
  #
  # That is the whole point of a separate job. Every other asset here embeds the
  # tag, which is correct — a tarball *is* a version. But the URL an operator
  # pipes to a shell has to be typeable before they know what the latest tag is,
  # and `/releases/latest/download/<name>` only resolves when `<name>` is
  # constant across releases. So this one asset keeps a fixed name, and the
  # script it holds resolves the tag at run time.
  #
  # Not a step in `build`: that job is a six-way matrix, and six runners racing
  # to upload the same asset name is a coin flip over which one wins. One job,
  # one upload.
  installer:
    name: install.sh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A syntax error in the installer is only discoverable by running it, and
      # by the time an operator runs it the release is already published. `sh -n`
      # parses without executing; shellcheck is on the runner image already.
      - name: the installer parses and lints
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          shellcheck -s sh scripts/install.sh
          sh scripts/install.sh --help >/dev/null
          # Exit codes are load-bearing for `curl … | sh`: a failed install that
          # exits 0 looks to a caller exactly like a successful one.
          if sh scripts/install.sh --libc nonsense >/dev/null 2>&1; then
            echo "install.sh accepted a bad --libc" >&2; exit 1
          fi

      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-upload.sh "$VERSION" scripts/install.sh

  # The .deb and the .rpm: the musl binary `build` already tested, wrapped.
  #
  # Downstream of `build` rather than steps inside it, for two reasons. A
  # package is made *from* a tarball, so the tarball has to have passed first
  # -- including the check that the binary in it serves the reader -- and
  # `needs` is how that is said. And it keeps the six-way matrix about
  # compiling: only two of its six targets have a package at all.
  #
  # Musl and not glibc, for the reason install.sh defaults to it. A package
  # declares what it depends on, and the glibc build depends on a libc at least
  # as new as the runner's, which is newer than most of the machines these
  # formats exist to serve. The static build depends on nothing, so one file
  # per architecture covers every release of every distribution, and
  # `require_static` in packaging/linux/common.sh refuses to wrap anything else.
  linux-packages:
    name: ${{ matrix.arch }} .deb and .rpm
    needs: build
    # `needs: build` alone would skip this whenever *any* of the six targets
    # failed, the four this job never touches included -- and "ship five of
    # six" is the rule `build` sets for itself. So it runs regardless, and
    # whether its own input exists is settled by the download below, which
    # fails, loudly and for the right reason, when it does not.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners again, and here it is load-bearing rather than
          # tidy: the install test below *executes* the packaged binary
          # inside a container, and an amd64 runner cannot run an arm64 one.
          - os: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tarball

      # The checksum is checked even though this file never left GitHub. It
      # costs nothing, and it is the only thing that would notice an artifact
      # that was truncated in storage -- which would otherwise surface as a
      # package whose binary segfaults.
      - name: unpack the binary that was tested
        run: |
          set -euo pipefail
          NAME="cairn-${VERSION}-${{ matrix.target }}"
          ( cd tarball && sha256sum -c "$NAME.tar.gz.sha256" )
          mkdir -p unpacked
          tar -C unpacked -xzf "tarball/$NAME.tar.gz"

      # dpkg-deb is on the image because the image is Ubuntu. rpmbuild is not.
      - name: rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: build the packages
        run: |
          set -euo pipefail
          packaging/linux/build-deb.sh --binary unpacked/cairn \
            --version "$VERSION" --arch ${{ matrix.arch }} --out dist
          packaging/linux/build-rpm.sh --binary unpacked/cairn \
            --version "$VERSION" --arch ${{ matrix.arch }} --out dist

      # A package that builds is not a package that installs, and the
      # difference is found by whoever runs `apt install` first. So each one
      # is installed here, by its distribution's own package manager, in an
      # image with nothing else in it -- then run, used to audit the published
      # log, and removed. packaging/linux/verify.sh says what it holds a
      # package to.
      #
      # Two images per format: a long-term release and a current one.
      # fedora is deliberately unpinned -- if a new Fedora stops installing
      # this, the dry run should be where that is learned. It has already
      # earned its place: it merged /usr/sbin into /usr/bin, and the first
      # version of this test failed a correct package over it.
      #
      # almalinux:9 and not :8, because the test audits the launch log and
      # that log's verifiers need Python 3.9. RHEL 8's python3 is 3.6: the
      # package installs there and the binary runs, and the audit then reports
      # four claims it cannot re-verify. That is the distribution's Python and
      # not a packaging fault, so it is documented rather than tested.
      #
      # None of these is old enough to object to zstd, which is what the
      # builders' explicit xz and gzip are for -- so the builders check that
      # in the artifact instead, and do not rely on an image to notice.
      - name: each installs on a clean system, runs, and leaves
        run: |
          set -euo pipefail
          TAGGED=""
          if [ "${{ github.ref_type }}" = "tag" ]; then TAGGED="--tagged"; fi
          for image in debian:12 ubuntu:24.04; do
            packaging/linux/verify.sh --package dist/*.deb --image "$image" \
              --version "$VERSION" --binary unpacked/cairn $TAGGED
          done
          for image in almalinux:9 fedora:latest; do
            packaging/linux/verify.sh --package dist/*.rpm --image "$image" \
              --version "$VERSION" --binary unpacked/cairn $TAGGED
          done

      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb *.rpm; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-upload.sh "$VERSION" dist/*.deb dist/*.deb.sha256 dist/*.rpm dist/*.rpm.sha256

  # The public halves of the keys Cairn.app's Check for Updates… trusts, for
  # macos-dmg to build in: Ed25519 for Sparkle, ML-DSA-87 (post-quantum) for
  # the app's own check. Both derived from the one secret, CAIRN_UPDATES_KEY,
  # rather than kept as settings that could disagree with it. On macOS
  # because the Linux image's OpenSSL predates ML-DSA (3.5) and Homebrew's
  # does not; packaging/macos/updates.sh says the rest. No secret, no keys,
  # and the app opens the releases page.
  updates-key:
    name: update signing keys
    runs-on: macos-latest
    # The signing secrets are read only by jobs in this environment. GitHub
    # creates it on first use with no rules, so this changes nothing until the
    # owner moves CAIRN_UPDATES_KEY and the MACOS_* secrets into it and limits
    # it to `v*` tags (Settings -> Environments -> release); after that, no
    # branch, pull request or other job can read them.
    #
    # Only a `v*` tag asks for it. A job naming an environment its ref may not
    # deploy to is refused, not run without the secrets, so once the tag rule
    # is on, a plain `environment: release` would fail this job and the three
    # below on every branch dry run -- the one path that builds the .dmg
    # before a release. On a branch these four run outside the environment,
    # where none of its secrets exist, and take the unsigned path they already
    # have for a repository with no secrets. The same expression is on each.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    outputs:
      public_key: ${{ steps.key.outputs.public_key }}
      pq_public_key: ${{ steps.key.outputs.pq_public_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Homebrew runs its own Ruby and may update itself; it does so before
      # the update seed is anywhere in the environment.
      - name: OpenSSL with ML-DSA
        run: brew list --versions openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - id: key
        env:
          CAIRN_UPDATES_KEY: ${{ secrets.CAIRN_UPDATES_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CAIRN_UPDATES_KEY" ]; then
            echo "::notice::No CAIRN_UPDATES_KEY secret: Cairn.app will not check for updates. packaging/README.md says how to add one."
            echo "public_key=" >> "$GITHUB_OUTPUT"
            echo "pq_public_key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLIC_KEY="$(packaging/macos/updates.sh public-key)"
          PQ_PUBLIC_KEY="$(packaging/macos/updates.sh pq-public-key)"
          echo "SUPublicEDKey $PUBLIC_KEY"
          echo "CairnMLDSA87PublicKey ${PQ_PUBLIC_KEY:0:16}… ($(printf '%s' "$PQ_PUBLIC_KEY" | base64 -d | wc -c | tr -d ' ') bytes)"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          echo "pq_public_key=$PQ_PUBLIC_KEY" >> "$GITHUB_OUTPUT"

  # The macOS disk image: both darwin binaries `build` already tested, joined
  # into one universal binary, in an installer package, in a .dmg.
  #
  # One image for every Mac, because "which chip do I have" is a question a
  # download page should not ask. That is also why this cannot be a step in
  # `build`: it needs two of that job's outputs at once, from two different
  # runners. packaging/macos/build-dmg.sh says why the image holds an
  # installer rather than an app to drag.
  macos-dmg:
    name: universal .dmg
    needs: [build, updates-key]
    # As for `linux-packages`: a broken Linux target is no reason to withhold
    # the macOS image, and a missing darwin tarball fails the download. A
    # malformed update key is, though: shipped anyway, the image would hold an
    # app that never offers an update, and nobody would notice until the next
    # release did not arrive.
    if: ${{ !cancelled() && needs.updates-key.result == 'success' }}
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
    env:
      # `secrets` cannot be read in a step's `if:`, so whether there is a
      # certificate is decided here, once, as a plain string.
      HAVE_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
      # Read by build-dmg.sh, which writes them into Cairn.app as SUPublicEDKey
      # and CairnMLDSA87PublicKey, and by verify-dmg.sh, which checks they
      # landed. Empty without the secret.
      CAIRN_UPDATES_PUBLIC_KEY: ${{ needs.updates-key.outputs.public_key }}
      CAIRN_UPDATES_PQ_PUBLIC_KEY: ${{ needs.updates-key.outputs.pq_public_key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: aarch64-apple-darwin
          path: tarball/arm64
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-apple-darwin
          path: tarball/x86_64

      - name: unpack the binaries that were tested
        run: |
          set -euo pipefail
          for pair in arm64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            dir="${pair%%:*}"; target="${pair#*:}"
            NAME="cairn-${VERSION}-${target}"
            ( cd "tarball/$dir" && shasum -a 256 -c "$NAME.tar.gz.sha256" )
            mkdir -p "unpacked/$dir"
            tar -C "unpacked/$dir" -xzf "tarball/$dir/$NAME.tar.gz"
          done

      # **This step has never run**, and neither has the signing half of
      # build-dmg.sh: there is no Apple Developer ID in this repository's
      # secrets, so `HAVE_DEVELOPER_ID` has only ever been false and every
      # image so far is unsigned. It is GitHub's documented sequence for
      # putting a certificate on a macOS runner, written down so that the day
      # a certificate exists is a day of adding secrets. Dry-run it with
      # `workflow_dispatch` before a tag depends on it. packaging/README.md
      # lists the seven secrets.
      #
      # A keychain of its own, with a password made up on the spot: the
      # runner's login keychain is locked, and nothing here should outlive
      # the job.
      - name: import the Developer ID certificates
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "CAIRN_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      # Built here rather than in `build`, which has no Mac that makes both
      # slices: one `swift build` per architecture, joined with lipo, on
      # whichever Swift the runner image carries. build-dmg.sh refuses it if
      # its architectures are not the binary's.
      - name: build Cairn.app
        run: |
          swift --version
          gui/macos-app/build.sh --universal

      # With no secrets set, all of these are empty strings, which
      # build-dmg.sh reads as "unsigned" -- the same as not setting them.
      - name: build the disk image
        env:
          CAIRN_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          CAIRN_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          CAIRN_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          CAIRN_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          packaging/macos/build-dmg.sh --version "$VERSION" --out dist \
            --binary unpacked/arm64/cairn --binary unpacked/x86_64/cairn \
            --app gui/macos-app/build/Cairn.app

      # `--install`, because a runner is disposable and a developer's laptop
      # is not. It is the only test of two things nothing else can check: that
      # installing leaves the ownership of /usr/local/bin alone, which is the
      # whole reason the payload lives in /usr/local/cairn; and that
      # `sudo installer` accepts this package from a terminal when Gatekeeper
      # would refuse a double-click, which the README inside the image tells
      # every user of an unsigned release to rely on.
      - name: it mounts, installs, runs, and leaves
        run: |
          set -euo pipefail
          TAGGED=""
          if [ "${{ github.ref_type }}" = "tag" ]; then TAGGED="--tagged"; fi
          packaging/macos/verify-dmg.sh --install $TAGGED --version "$VERSION" \
            --dmg "dist/cairn-${VERSION}-macos-universal.dmg"

      - name: checksum
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "cairn-${VERSION}-macos-universal.dmg" \
            > "cairn-${VERSION}-macos-universal.dmg.sha256"
          cat "cairn-${VERSION}-macos-universal.dmg.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/
          if-no-files-found: error

      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-upload.sh "$VERSION" "dist/cairn-$VERSION-macos-universal.dmg" "dist/cairn-$VERSION-macos-universal.dmg.sha256"

  # The release page's text, written once, last, by one job.
  #
  # Last, because it describes the assets that are actually there, and it
  # cannot know that until every job that uploads has finished. `!cancelled()`
  # rather than the default, which would skip this whenever any job it needs
  # failed -- and `fail-fast: false` exists precisely so that a release can go
  # out with five packages when the sixth broke. That release still needs a
  # page, and the page needs to say which one is missing. It does.
  #
  # packaging/release-notes.sh has the two rules this follows, and the two
  # times the page went wrong that they come from.
  notes:
    name: release notes
    needs: [build, installer, linux-packages, macos-dmg]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
    env:
      HAVE_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: write the install section under the changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNED=""
          if [ "$HAVE_DEVELOPER_ID" = "true" ]; then SIGNED="--macos-signed"; fi
          packaging/release-notes.sh --tag "$GITHUB_REF_NAME" $SIGNED

      # A dry run has no release to edit, and a script that only ever runs at
      # release time is a script whose first failure is a release. So a dry
      # run renders the same text from the packages it just built and puts it
      # in the run's summary: the script is exercised, and whoever dispatched
      # the run sees the page the next tag would get.
      #
      # `continue-on-error`, because a package job that failed uploaded
      # nothing, and that is a case the text handles -- it should be seen
      # handling it rather than stop the preview.
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          pattern: linux-packages-*
          path: preview
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: macos-dmg
          path: preview
      - name: preview the release page
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          mkdir -p preview
          { ls preview; echo install.sh; } > assets.txt
          SIGNED=""
          if [ "$HAVE_DEVELOPER_ID" = "true" ]; then SIGNED="--macos-signed"; fi
          packaging/release-notes.sh --tag "$VERSION" --print $SIGNED \
            --assets-file assets.txt --body-file /dev/null >> "$GITHUB_STEP_SUMMARY"

  # Cairn.app's update feed: `appcast.xml` on the release, naming that
  # release's .dmg, with an Ed25519 signature over the image for Sparkle and
  # an ML-DSA-87 one over the item for the app (packaging/macos/updates.sh).
  #
  # After `notes`, so it is the last thing a release gets: the app is never
  # pointed at a release whose image is still uploading, or whose page still
  # lacks its install section. The feed's release notes are that page, as
  # GitHub renders it.
  #
  # The feed is published twice. Apps built since this change read it from a fixed
  # release tagged `updates` (SUFeedURL in gui/macos-app/Info.plist), which
  # this job overwrites and nothing else touches, so between a release going
  # public and this job finishing -- an hour, when the macOS runners are
  # busy -- a check reads the previous feed and says "up to date". Earlier
  # apps read releases/latest/download/appcast.xml, which GitHub points at
  # the newest release the moment it is published and which 404s until this
  # upload; they get Sparkle's "error retrieving update information" in that
  # window (1.14.0 and earlier). The copy on the versioned release keeps them updating at all.
  #
  # A dry run writes and checks the feed against the image it just built and
  # keeps it as an artifact, so the script that runs only at release time has
  # run before one.
  appcast:
    name: update feed
    needs: [updates-key, macos-dmg, notes]
    if: ${{ !cancelled() && needs.macos-dmg.result == 'success' && needs.updates-key.outputs.public_key != '' }}
    # macOS for the same reason as updates-key: an OpenSSL with ML-DSA.
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist
      - name: OpenSSL with ML-DSA
        run: brew list --versions openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: write and check the feed
        env:
          CAIRN_UPDATES_KEY: ${{ secrets.CAIRN_UPDATES_KEY }}
          PUBLIC_KEY: ${{ needs.updates-key.outputs.public_key }}
          PQ_PUBLIC_KEY: ${{ needs.updates-key.outputs.pq_public_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="dist/cairn-${VERSION}-macos-universal.dmg"
          : > notes.html
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh api -H "Accept: application/vnd.github.html+json" \
              "repos/${{ github.repository }}/releases/tags/$VERSION" --jq '.body_html // ""' > notes.html
          fi
          packaging/macos/updates.sh appcast --dmg "$DMG" --version "$VERSION" \
            --repo "${{ github.repository }}" --notes-html notes.html --out dist/appcast.xml
          packaging/macos/updates.sh verify --appcast dist/appcast.xml --dmg "$DMG" \
            --public-key "$PUBLIC_KEY" --pq-public-key "$PQ_PUBLIC_KEY"
      - name: publish it
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          gh release upload "$VERSION" dist/appcast.xml --clobber --repo "$REPO"
          # The fixed release exists once; a prerelease, and never "latest",
          # so it stays out of releases/latest and install.sh's way. Its tag
          # names no version, so neither `push: tags: v*` above nor
          # release-please reads it as one.
          if ! gh release view updates --repo "$REPO" >/dev/null 2>&1; then
            gh release create updates --repo "$REPO" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Update feed" \
              --notes "Cairn.app's Check for Updates… reads appcast.xml here. release.yml rewrites it for each release once that release's .dmg is up; the file always names the newest release. Nothing else on this page is for installing: see the latest release."
          fi
          # Several releases can be in flight at once -- the macOS runners
          # queue for an hour at times, and release-please cut three tags in
          # ninety minutes today -- and their runs finish in no particular
          # order. The fixed feed must only ever move forward: a 1.14.0 run
          # finishing after 1.15.1's must not put 1.14.0 back in front of
          # every installed app, where it would sit until the next release.
          # The versioned copy above is unconditional; this one yields to a
          # newer feed already there. Same version (a re-run) overwrites.
          # A pre-release tag is never the fixed feed: its feed carries the
          # bare version (1.16.0 for v1.16.0-rc.1), so an RC finishing after
          # the final would replace it and leave every app that took the RC
          # unable to see the final, which has the same number.
          case "$VERSION" in
            *-*)
              echo "$VERSION is a pre-release; the fixed updates feed is for releases"
              exit 0
              ;;
          esac
          current=""
          if gh release download updates --pattern appcast.xml --dir current --repo "$REPO" 2>/dev/null; then
            current="$(sed -n 's/.*<sparkle:version>\([^<]*\)<.*/\1/p' current/appcast.xml | head -n 1)"
          fi
          newest="$(printf '%s\n%s\n' "${current:-0}" "${VERSION#v}" | sort -V | tail -n 1)"
          if [ -n "$current" ] && [ "$newest" != "${VERSION#v}" ]; then
            echo "the updates feed already names $current, newer than ${VERSION#v}; leaving it"
          else
            gh release upload updates dist/appcast.xml --clobber --repo "$REPO"
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: appcast
          path: dist/appcast.xml

  # Only now is this the latest release. release-please creates every release
  # as a draft and release-please.yml publishes it as a prerelease, which
  # GitHub's releases/latest redirect skips, so the two things that resolve through it
  # -- the documented installer, and the update feed of every Cairn.app up to
  # 1.14.0 -- keep pointing at the previous complete release while this one
  # builds. Before this, the redirect moved the moment release-please
  # published: three releases were cut inside ninety minutes one afternoon
  # with the macOS runners queueing for an hour each, every installed app
  # read a 404 from the newest release's missing feed the whole time, and
  # install.sh would have resolved to a release with no binaries in it (as
  # v1.3.0 once was).
  #
  # Complete means: notes written, and the feed up -- or no feed possible for
  # this build, which is a checkout without the update key. A release whose
  # .dmg failed stays a prerelease until that job is re-run; it is not
  # complete, and promoting it would hand the old apps a 404 again.
  #
  # `--latest` only when this tag is the newest: runs finish in any order,
  # and a 1.15.1 run finishing after 1.15.2's must not pull the redirect back.
  publish:
    name: make it the latest release
    needs: [updates-key, notes, appcast]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.notes.result == 'success'
          && (needs.appcast.result == 'success'
              || (needs.appcast.result == 'skipped' && needs.updates-key.outputs.public_key == '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: promote the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          current="$(gh release view --json tagName --jq .tagName --repo "$REPO" 2>/dev/null || true)"
          newest="$(printf '%s\n%s\n' "${current:-v0.0.0}" "$VERSION" | sort -V | tail -n 1)"
          if [ "$newest" = "$VERSION" ]; then
            gh release edit "$VERSION" --prerelease=false --latest --repo "$REPO"
            echo "$VERSION is the latest release"
          else
            gh release edit "$VERSION" --prerelease=false --latest=false --repo "$REPO"
            echo "$VERSION is complete; $current stays the latest release, being newer"
          fi
