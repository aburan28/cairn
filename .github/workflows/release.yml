name: release

# Tag builds, plus a manual trigger. `--locked` because a release built from an
# unlocked dependency resolution is a release nobody can reproduce.
#
# `workflow_dispatch` exists because this workflow had never run once: releases
# only fire on tags, so a break in it stays invisible until the moment somebody
# is trying to cut a release and least wants to debug YAML. Dispatching builds
# and packages without publishing, so the path can be exercised on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One target's toolchain failing should not hide whether the other packaged.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # All five binaries ship together: a node operator needs the CLI, the MCP
      # server, the p2p daemon, the serve daemon and the bootstrap generator to
      # be the same commit, and separate tarballs invite mixing versions.
      #
      # `gen-bootstrap` used to be left out, which made the shipped README wrong
      # -- it tells an operator to run it, and a release did not contain it. The
      # loop below fails on a missing binary rather than quietly packaging four
      # of five, because that is exactly how it went unnoticed.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          NAME="proofwork-${{ github.ref_name }}-${{ matrix.target }}"
          DIR="target/${{ matrix.target }}/release"
          BINS="proofwork proofwork-mcp proofwork-p2p proofwork-serve proofwork-gen-bootstrap"
          for bin in $BINS; do
            [ -x "$DIR/$bin" ] || { echo "release is missing $bin" >&2; exit 1; }
          done
          tar -C "$DIR" -czf "$NAME.tar.gz" $BINS
          # A checksum beside the artifact, because this project's whole claim is
          # that you do not have to trust the party who served you the bytes.
          # Shipping binaries with no way to check them would be the one
          # inconsistency nobody could miss. `shasum` on macOS, `sha256sum` on
          # Linux -- neither is present on both.
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          cat "$NAME.tar.gz.sha256"

      # Proof the thing that was just packaged actually runs on a clean unpack,
      # which is the failure a tarball of the wrong architecture or a missing
      # dynamic library produces -- and which no other job in this repository
      # would catch, because every other job runs binaries straight out of
      # `target/`.
      - name: the unpacked binaries run
        shell: bash
        run: |
          set -euo pipefail
          NAME="proofwork-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p /tmp/unpacked && tar -C /tmp/unpacked -xzf "$NAME.tar.gz"
          for bin in proofwork proofwork-serve proofwork-p2p proofwork-gen-bootstrap; do
            "/tmp/unpacked/$bin" --help >/dev/null 2>&1 \
              || { echo "$bin --help failed from the tarball" >&2; exit 1; }
          done
          # And one real end-to-end check, not just `--help`: the published log
          # ships in the repository, so a release can verify it the way a
          # downloader would.
          /tmp/unpacked/proofwork --log launch/proofwork.jsonl --root . audit
          echo "unpacked binaries run and audit the published log"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            proofwork-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            proofwork-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      # Publishing is tag-only. A manual dispatch builds, packages and proves
      # the tarball runs, and stops there -- so the path can be exercised
      # without minting a release nobody asked for.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            proofwork-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            proofwork-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          body: |
            Binaries for `${{ github.ref_name }}`. Five to a tarball: `proofwork`
            (CLI), `proofwork-mcp`, `proofwork-p2p`, `proofwork-serve`,
            `proofwork-gen-bootstrap`.

            ```sh
            tar -xzf proofwork-${{ github.ref_name }}-<target>.tar.gz
            sha256sum -c proofwork-${{ github.ref_name }}-<target>.tar.gz.sha256
            ./proofwork --help
            ```

            **Check it before you trust it.** A copy of the settled log ships in
            `launch/`, and re-deriving it is the point of the whole project:

            ```sh
            ./proofwork --log launch/proofwork.jsonl --root . audit
            ./proofwork --log launch/proofwork.jsonl --root . verify \
                --from launch/checkpoint.json --root-key launch/root-key.pub --audit
            ```
