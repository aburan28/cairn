name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # `--locked` on everything that compiles the workspace: Cargo.lock is
      # checked in, and a CI run that quietly rewrites it is testing a
      # dependency set nobody committed.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      # `--all-features` too, because `insecure-swarm-tcp` is off by default and
      # gated code that nothing builds is gated code that rots.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      # The demos are part of the contract: if the documented walkthrough stops
      # working, the README is lying.
      - run: cargo build --release --locked
      - run: ./scripts/demo.sh
      - run: ./scripts/ratchet-demo.sh
      # Runs the MCP server as a real process. The unit tests call handle_line
      # directly and structurally cannot catch a stray write to stdout, which is
      # the failure that breaks every MCP client and looks like their bug.
      - run: ./scripts/mcp-smoke.sh
      - run: ./scripts/identity-demo.sh
      # Drives proofwork-serve over a real socket. The only test in the repo
      # where the client shares nothing with the node but an address, which is
      # the arrangement every outside contributor is in.
      - run: ./scripts/serve-smoke.sh

  reference:
    # The second implementation, and the frozen vectors it must reproduce.
    #
    # `conformance/vectors.json` is now an artifact rather than a build
    # product: it was generated by the Python reference this crate replaced,
    # and it is kept precisely because it came from an implementation in
    # another language. Regenerating it from either Rust implementation would
    # turn the contract into a description of one program's behaviour, so
    # nothing regenerates it -- the reference reproduces it or fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked --manifest-path reference/rust/Cargo.toml
      - run: cargo test --manifest-path reference/rust/Cargo.toml
      - run: cargo fmt --check --manifest-path reference/rust/Cargo.toml
      - run: cargo clippy --manifest-path reference/rust/Cargo.toml --all-targets -- -D warnings
      - run: ./reference/rust/target/release/proofwork-reference conformance conformance/vectors.json

  msrv:
    # The crate claims rust-version 1.89 (`File::try_lock` stabilized there).
    # An unchecked MSRV is a claim, not a fact, and downstream users are the
    # ones who find out. 1.75 was the original claim and was measurably false:
    # transitive deps need edition2024.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features

  tla:
    # A rule that is implemented but not modeled is incomplete work. Tests
    # exercise the paths someone thought of; TLC exercises the interleavings
    # nobody did, and "anyone can re-derive every settled result from the log
    # alone" is a property no unit test can state.
    #
    # scripts/tla.sh returns 3 when it could not check anything at all. That
    # status is not tolerated here: on a runner we control, "I could not check"
    # is a broken job. Locally it is a skip; the script never turns it into a
    # pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ~8 MB. The key is dated rather than fixed: a fixed key silently pins the
      # first jar ever cached, which is a stale toolchain nobody chose.
      - uses: actions/cache@v4
        with:
          path: .local/tla2tools.jar
          key: tla2tools-2026-07
      - run: ./scripts/tla.sh

  interop:
    # The strongest check in the repo. "Anyone can independently re-derive every
    # settled result" is worth nothing if it means "anyone running my code". Two
    # implementations, written separately in different languages, must agree on
    # every id and every Merkle root, and each must be able to audit a log the
    # other produced. This is what catches a canonical-encoding drift before it
    # silently forks the network's identity scheme.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path reference/rust/Cargo.toml
      - run: cargo test --manifest-path reference/rust/Cargo.toml
      # The frozen vectors are the format contract. They were generated by the
      # Python reference this crate replaced, which is exactly why they are
      # kept: evidence from an implementation in another language.
      - run: ./reference/rust/target/release/proofwork-reference conformance conformance/vectors.json
      - run: ./scripts/interop.sh

  audit:
    # Known-vulnerable dependencies fail the build. Deliberately not advisory:
    # a warning nobody is forced to read is a warning nobody reads, and this
    # project ships code that executes attacker-authored verifiers -- the
    # dependency tree is part of the sandbox boundary. `continue-on-error` is
    # spelled out so the intent survives someone "fixing" a red build.
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  examples:
    # Every example objective must pass schema validation and match its pinned
    # verifier hashes -- not only the ones the demo scripts happen to post.
    # Without this, an example nobody demos can rot into one the CLI rejects,
    # and a stale sha256 pin turns an open bounty into an unsatisfiable one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: ./scripts/check-examples.sh
