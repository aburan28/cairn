name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # `--locked` on everything that compiles the workspace: Cargo.lock is
      # checked in, and a CI run that quietly rewrites it is testing a
      # dependency set nobody committed.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      # `--all-features` too: gated code that nothing builds is gated code that
      # rots, and the docs gate below only sees a feature if it is enabled.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      # Broken doc links, denied rather than warned. This crate's comments are
      # load-bearing -- the arguments for why a rule exists live in them -- so a
      # link that resolves to nothing is a defect in the primary artifact, not
      # cosmetic. Twenty-two had accumulated before this gate existed.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --all-features
      # The demos are part of the contract: if the documented walkthrough stops
      # working, the README is lying.
      - run: cargo build --release --locked
      - run: ./scripts/demo.sh
      - run: ./scripts/ratchet-demo.sh
      # `try` and `scaffold`: the one command that waits on a real epoch
      # boundary, and the generated challenge that has to be postable. Neither
      # can be checked from a fixture timestamp.
      - run: ./scripts/try-demo.sh
      # The canary trap around the binary rather than around a `Node`. Proves
      # the one thing that matters economically and that no unit test can show
      # in one place: `audit --no-rerun` passes a rubber-stamper, `audit`
      # catches it at the price of every verifier in the log, and a docket
      # catches it at the price of the cheap one.
      - run: ./scripts/canary-demo.sh
      # A bonded dispute through the CLI, then the *other* implementation
      # auditing the finished log. A second opinion that has never seen a
      # record kind reports "log verified" over money it did not look at,
      # which is how availability settlements went unchecked for a while.
      - run: ./scripts/dispute-demo.sh
      # Bonded verification the whole way through: two operators standing behind
      # the same verdicts, a docket naming the one that did not look, a slash
      # moving the bond, and the reference agreeing about where it went. It is
      # the only place the free half and the expensive half of the mechanism sit
      # on one log with the money visible between them.
      - run: ./scripts/attestation-demo.sh
      # Adversarial strategies played for money against the real rules engine.
      # The verdicts are asserted in `tests/arena.rs`; this run is the readable
      # payoff table, and it exits non-zero if an attack that should be closed
      # has re-opened.
      - run: cargo run --release --bin arena
      # Runs the MCP server as a real process. The unit tests call handle_line
      # directly and structurally cannot catch a stray write to stdout, which is
      # the failure that breaks every MCP client and looks like their bug.
      - run: ./scripts/mcp-smoke.sh
      - run: ./scripts/identity-demo.sh
      # Drives cairn-serve over a real socket. The only test in the repo
      # where the client shares nothing with the node but an address, which is
      # the arrangement every outside contributor is in.
      - run: ./scripts/serve-smoke.sh
      # The same socket, one process. `serve-smoke` drains with a separate
      # command, so it cannot tell whether `daemon::run` wired the queue to the
      # loop that holds the write lock -- and that seam is the whole reason the
      # unified node exists. Also the only check that both binaries build the
      # same Config: an argument wired wrong in one is invisible to the other.
      - run: ./scripts/node-smoke.sh
      # Two processes sharing nothing but a socket: a node with only the log
      # fetches its pinned verifier from a stranger and settles a claim with it.
      #
      # This path had never been run. `swarm::tcp` was a complete, encrypted,
      # end-to-end tested transfer with no caller in any shipped binary, and two
      # bugs sat in the seam it left: a content address spelled one way on the
      # wire and another in the decoded struct, and a Python loader that could
      # not import a file whose name is a hash. Both were invisible to unit
      # tests of either side.
      - run: ./scripts/blob-demo.sh
      # Six stores that share nothing, one shard each, one of them corrupt: the
      # file comes back byte for byte and the liar is named.
      #
      # Here for the same reason the line above is. `src/shards/` has no network
      # caller yet, so the only thing standing between it and the state
      # `swarm::tcp` was in -- complete, tested, and agreeing with nobody but
      # itself -- is a script that drives it the way an operator would, across
      # separate invocations and separate directories.
      - run: ./scripts/shard-demo.sh
      # Every binary answers `--help` with 0 and misuse with 2.
      #
      # Two of them exited 2 for `--help`, which tells somebody who asked a
      # question, and asked it correctly, that they used the tool wrong.
      # `cmd --help >/dev/null || fail` is how a packaging check or a container
      # healthcheck asks whether a binary runs at all, so the wrong code here
      # fails a build for no reason. Cheap to pin, and it drifted once already.
      - run: |
          # Every shipped binary, not a subset. `cairn-gen-bootstrap` was
          # missing from this list and answered exit 2 to `--help` for its whole
          # life; the release workflow's unpack check is what found it.
          for BIN in cairn cairn-mcp cairn-serve cairn-p2p cairn-gen-bootstrap; do
            ./target/release/$BIN --help >/dev/null 2>&1 \
              || { echo "$BIN --help exited $?" >&2; exit 1; }
          done
          # `|| status=$?` rather than a bare call then `$?`: GitHub runs this
          # with `bash -e`, so a bare call that exits 2 -- which is the whole
          # point of the check -- aborts the step before the comparison runs.
          # The loop above survives only because `||` shields its call. This one
          # could never pass, and nobody saw it: until the clippy step ahead of
          # it went green this step was simply never reached, so the check meant
          # to pin the misuse codes had not run once since it was written.
          for BIN in cairn-serve cairn-p2p; do
            status=0
            ./target/release/$BIN --definitely-not-a-flag >/dev/null 2>&1 || status=$?
            [ "$status" -eq 2 ] \
              || { echo "$BIN exited $status on a bad argument, want 2" >&2; exit 1; }
          done

  reference:
    # The second implementation, and the frozen vectors it must reproduce.
    #
    # `conformance/vectors.json` is now an artifact rather than a build
    # product: it was generated by the Python reference this crate replaced,
    # and it is kept precisely because it came from an implementation in
    # another language. Regenerating it from either Rust implementation would
    # turn the contract into a description of one program's behaviour, so
    # nothing regenerates it -- the reference reproduces it or fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release --locked --manifest-path reference/rust/Cargo.toml
      - run: cargo test --manifest-path reference/rust/Cargo.toml
      - run: cargo fmt --check --manifest-path reference/rust/Cargo.toml
      - run: cargo clippy --manifest-path reference/rust/Cargo.toml --all-targets -- -D warnings
      - run: ./reference/rust/target/release/cairn-reference conformance conformance/vectors.json
      # The two vector files that cover signing. They lost their independent
      # checker when the Python reference went away, which mattered more than
      # it looked: a signature is a field of the record, so it is inside the
      # id -- an implementation could verify every signature perfectly and
      # still settle a different claim.
      - run: ./reference/rust/target/release/cairn-reference signed-records conformance/signed-records.json
      - run: ./reference/rust/target/release/cairn-reference signatures conformance/signatures.json

  msrv:
    # The crate claims rust-version 1.89 (`File::try_lock` stabilized there).
    # An unchecked MSRV is a claim, not a fact, and downstream users are the
    # ones who find out. 1.75 was the original claim and was measurably false:
    # transitive deps need edition2024.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features

  tla:
    # A rule that is implemented but not modeled is incomplete work. Tests
    # exercise the paths someone thought of; TLC exercises the interleavings
    # nobody did, and "anyone can re-derive every settled result from the log
    # alone" is a property no unit test can state.
    #
    # scripts/tla.sh returns 3 when it could not check anything at all. That
    # status is not tolerated here: on a runner we control, "I could not check"
    # is a broken job. Locally it is a skip; the script never turns it into a
    # pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # ~8 MB. The key is dated rather than fixed: a fixed key silently pins the
      # first jar ever cached, which is a stale toolchain nobody chose.
      - uses: actions/cache@v6
        with:
          path: .local/tla2tools.jar
          key: tla2tools-2026-07
      - run: ./scripts/tla.sh

  interop:
    # The strongest check in the repo. "Anyone can independently re-derive every
    # settled result" is worth nothing if it means "anyone running my code". Two
    # implementations, written separately in different languages, must agree on
    # every id and every Merkle root, and each must be able to audit a log the
    # other produced. This is what catches a canonical-encoding drift before it
    # silently forks the network's identity scheme.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path reference/rust/Cargo.toml
      - run: cargo test --manifest-path reference/rust/Cargo.toml
      # The frozen vectors are the format contract. They were generated by the
      # Python reference this crate replaced, which is exactly why they are
      # kept: evidence from an implementation in another language.
      - run: ./reference/rust/target/release/cairn-reference conformance conformance/vectors.json
      # The two vector files that cover signing. They lost their independent
      # checker when the Python reference went away, which mattered more than
      # it looked: a signature is a field of the record, so it is inside the
      # id -- an implementation could verify every signature perfectly and
      # still settle a different claim.
      - run: ./reference/rust/target/release/cairn-reference signed-records conformance/signed-records.json
      - run: ./reference/rust/target/release/cairn-reference signatures conformance/signatures.json
      - run: ./scripts/interop.sh
      # Here rather than in the `main` job because it ends by handing the
      # rotated store's plaintext export to the reference, and this job is
      # where both binaries already exist. Rotating a key changes every byte on
      # disk and must move neither a record nor the root -- the reference is
      # what makes that a claim about the log rather than about this binary.
      # Two `cairn-p2p` daemons. Here rather than in the `main` job because
      # the last step needs the reference binary: auditing the node that
      # *synced* is the case that matters -- no bundle, no authored objective,
      # verifier code obtained by hash -- and it was broken, because the
      # reference had no content-addressed fallback and called a re-verifiable
      # claim unverifiable. Until this script the daemon was the largest surface
      # in the repository with nothing running it.
      - run: ./scripts/p2p-demo.sh
      - run: ./scripts/rekey-demo.sh
      - run: ./scripts/differential.sh
      # Randomized, and seeded from the clock so each CI run explores
      # different inputs. A failure prints its seed, which is what makes it
      # reproducible rather than a ghost.
      - run: ./scripts/fuzz-differential.sh 3000
      # The published artifact, audited by both implementations on every run.
      #
      # `launch/cairn.jsonl` is the project's central piece of evidence: a
      # copy of a settled log that a stranger can re-derive from. It is a
      # committed file, so nothing else in CI touches it -- which meant a change
      # to the audit rules could make the published log fail to verify and every
      # job would stay green. A contributor's first command is `cairn audit`
      # on this file, and it must not be the thing that discovers the breakage.
      # No CAIRN_EPOCH_SECONDS here, deliberately: the log was built at the
      # default and this reproduces what a reader with no configuration sees.
      - run: |
          for BIN in ./target/release/cairn \
                     ./reference/rust/target/release/cairn-reference; do
            "$BIN" --log launch/cairn.jsonl --root . audit \
              | tee /dev/stderr | grep -q "log verified" \
              || { echo "$BIN rejects the published log" >&2; exit 1; }
          done
          ./target/release/cairn --log launch/cairn.jsonl --root . \
            verify launch/checkpoint.json --root-key launch/root-key.pub

  audit:
    # Known-vulnerable dependencies fail the build. Deliberately not advisory:
    # a warning nobody is forced to read is a warning nobody reads, and this
    # project ships code that executes attacker-authored verifiers -- the
    # dependency tree is part of the sandbox boundary. `continue-on-error` is
    # spelled out so the intent survives someone "fixing" a red build.
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  ui:
    # The Next.js chain reader. Typechecked and built, not merely linted: it
    # consumes `GET /chain`, and a change to that endpoint's shape should fail
    # here rather than in somebody's browser.
    #
    # Deliberately not in the `rust` job. A Rust contributor should not need a
    # Node toolchain, and `cairn-serve` renders the chain itself at
    # /chain.html with no build step -- ui/ is the richer client, not the only
    # one. See ui/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v7. The inputs used here -- `node-version`, `cache`,
      # `cache-dependency-path` -- are unchanged across v4..v7; what moved is the
      # runner's bundled Node and the cache backend, neither of which this job
      # pins. `actions/checkout` above is already on the same major line.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # `npm ci`, not `npm install`: it installs exactly the committed lockfile
      # and fails if the two disagree, which is the same argument `--locked`
      # makes for the Rust side.
      - run: npm ci
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - run: npm run build
        working-directory: ui

  examples:
    # Every example objective must pass schema validation and match its pinned
    # verifier hashes -- not only the ones the demo scripts happen to post.
    # Without this, an example nobody demos can rot into one the CLI rejects,
    # and a stale sha256 pin turns an open bounty into an unsatisfiable one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: ./scripts/check-examples.sh
      # The First-Blood instances are derived, not authored: `Q` is hashed to
      # the curve from a public seed so that nobody -- the funder included --
      # knows its discrete log. A checker edited by hand would silently break
      # that, and the resulting bounty would look identical. This re-runs the
      # derivation and fails on any drift between it and the checked-in files.
      - run: python3 scripts/derive-first-blood.py --check
      # The faster-algorithms baselines are derived too, and `check-examples.sh`
      # cannot catch an edit to one: an artifact is not pinned by anything, so a
      # hand-edited bubble network still scores 55 and still verifies -- it is
      # just no longer the algorithm its README names.
      - run: python3 examples/faster-algorithms/tools/build_baselines.py --check
      # And the property that decides whether those four bounties are safe to
      # fund: on a minimise objective an evaluator that scored garbage as zero
      # would hand the frontier and the whole pool to an empty list. That is not
      # visible in a passing artifact, so it gets its own adversarial battery.
      - run: python3 examples/faster-algorithms/tools/selftest.py
