name: release-please

# Owns the *version* and the *changelog*. It owns no binaries: merging the PR
# it opens creates a `v*` tag, and this workflow then asks `release.yml` to
# build and publish the artifacts for it. Two workflows because deciding "what
# version is this" and "what bytes ship" are different jobs — a tool that does
# both tends to do one of them badly, and this repository already has strong
# opinions about what goes into a release tarball.
#
# How it works, for anyone who has not used it: on every push to main it keeps
# a single open "chore(main): release X.Y.Z" PR up to date, accumulating the
# changelog from commit messages. Nothing is released until a human merges
# that PR. So the release button is a code review, which is the right shape
# for a repository whose central claim is that results are independently
# checkable.
#
# ONE-TIME REPOSITORY SETTING, without which this workflow fails at the last
# step. The `permissions:` block below is necessary and not sufficient: there
# is a separate repository-level switch that forbids Actions from opening pull
# requests at all, and it is off by default.
#
#   Settings -> Actions -> General -> Workflow permissions
#   -> [x] Allow GitHub Actions to create and approve pull requests
#
# Until it is ticked, the run gets as far as committing the version bump and
# then dies with:
#
#   release-please failed: GitHub Actions is not permitted to create or
#   approve pull requests
#
# which reads like a bug in the token and is not one. It leaves the branch
# `release-please--branches--main--components--cairn` behind, already
# holding the correct commit; the next run after the setting is enabled opens
# the PR from it, so nothing is lost and nothing needs re-running by hand.
#
# Recorded here rather than in a runbook because this is where somebody will
# be looking when it happens. It is ticked on this repository as of v1.0.0 --
# five consecutive runs had failed on it, which is what "off by default" costs
# when nothing surfaces the reason. A fork starts with it off again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To dispatch `release.yml` at the tag, below. Without it that step 403s and
  # the release publishes with no binaries attached.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

      # Hand the tag to `release.yml`, which owns the binaries.
      #
      # This step looks redundant -- `release.yml` triggers on `push: tags`, and
      # the step above just pushed a tag. It is not. GitHub does not start a
      # workflow run for events created with `GITHUB_TOKEN`, so that push fires
      # nothing. The failure is silent and the shape of it is nasty: the release
      # is published, `/releases/latest` resolves, and `install.sh` gets all the
      # way past "no published release found" before 404ing on a tarball that
      # was never built. v1.0.0 shipped that way and needed a manual dispatch.
      #
      # `workflow_dispatch` and `repository_dispatch` are the documented
      # exceptions to that suppression, which is why this works where the tag
      # push does not, and why it needs no PAT. Dispatching at `--ref <tag>`
      # rather than at a branch is load-bearing twice over: `release.yml` gates
      # publishing on `startsWith(github.ref, 'refs/tags/')`, and takes its
      # VERSION from `github.ref_name` only when `ref_type` is `tag`. From a
      # branch it would build, name everything `0.0.0-dispatch.<run_id>`, and
      # upload nothing.
      - name: build the binaries for the tag just created
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
