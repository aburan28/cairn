name: release-please

# Owns the *version* and the *changelog*. It owns no binaries: merging the PR
# it opens creates a `v*` tag, and the last step below starts `release.yml` on
# that tag, which builds and publishes the artifacts. Two workflows because
# deciding "what version is this" and "what bytes ship" are different jobs — a
# tool that does both tends to do one of them badly, and this repository
# already has strong opinions about what goes into a release tarball.
#
# "Starts", and not "the tag triggers", because the tag triggers nothing. See
# the step itself for why; the short version is that v1.0.0 to v1.2.0 each got
# their assets from somebody dispatching the build by hand, and v1.3.0, which
# nobody dispatched, was published with none.
#
# How it works, for anyone who has not used it: on every push to main it keeps
# a single open "chore(main): release X.Y.Z" PR up to date, accumulating the
# changelog from commit messages. Nothing is released until a human merges
# that PR. So the release button is a code review, which is the right shape
# for a repository whose central claim is that results are independently
# checkable.
#
# The release it creates is a *draft* (`draft` in the config), and the step
# below publishes it as a *prerelease* before starting the build. Either way
# GitHub's releases/latest redirect -- which the documented installer and the
# update feed of older Cairn.app builds resolve through -- never points at
# it: it keeps pointing at the previous complete release until release.yml
# has built everything and promotes this one, as its last job. Merging the
# PR starts a release; it does not publish one.
#
# Draft rather than release-please's own `prerelease` flag, which reads as
# the obvious tool and is not one: release-please honours it only for a
# 0.x or a `-beta`-style version (manifest.ts: `config.prerelease &&
# (version.preRelease || major === 0)`), so on 1.15.3 it did nothing and
# the redirect moved the moment the release was published, as before.
#
# One changelog line per pull request.
#
# release-please does not read what a PR lands on main as one change. It reads
# every commit reachable from main, one by one (github.ts mergeCommitsGraphQL
# walks `history`, not the first-parent line), and it makes one entry for every
# blank-line-separated paragraph of a commit message that opens with a
# conventional type (commit.ts splitMessages). A merge commit puts the PR's
# branch commits on main beside the merge commit, whose body is the PR title,
# so a PR whose commits are all `feat:` is listed once for each of them and
# once more for the merge. 1.16.0 listed #224 five times and every other
# merge-commit PR twice. #224's merge message also carried its title as both
# subject and body, which on its own is two entries from one commit.
#
# There is no setting for it, and the two things that look like one are not:
#
#   - BEGIN_COMMIT_OVERRIDE in a PR body is the only way a PR's text reaches
#     the changelog for the `rust` strategy (commit.ts preprocessCommitMessage),
#     and it applies to every commit GitHub associates with the PR, branch
#     commits included. On a merge-commit PR it repeats the line once per
#     commit instead of replacing them: replayed over 1.16.0, 16 entries became
#     15.
#   - `changelog-type: github` does list each PR once, but it writes GitHub's
#     "What's Changed" list in place of the changelog: no Features / Fixes, no
#     scopes, and the hidden types below appear. It trades the format for the
#     fix. There is no first-parent switch and no "prefer the PR title" key in
#     the config schema.
#
# So the fix is a convention, and it needs no change to how PRs are merged and
# no rewriting of history. Exactly one release-visible message per PR, and it
# is the PR title:
#
#   - The PR title is a conventional commit. It is the merge commit's body (or
#     a squash commit's subject), so it is the changelog line.
#   - Branch commits do not use a visible type (feat, fix, perf, deps, docs).
#     Use chore, refactor or test, or no type at all.
#   - A merge or squash message names the title once, as subject or as body,
#     never both.
#
# Replayed offline over 1.16.0's real commits with release-please 17.11.2: 16
# entries as merged, 8 under this convention, one per PR. The functions named
# above are the same from 16.18 through 17.11.
#
# What to watch is the title, not the branch commits. A duplicate is noise; a
# PR whose title has no type is missing from the changelog and from the version
# bump (CONTRIBUTING.md, "Commit messages"). The case that bites is a squash
# merge of a one-commit PR, because GitHub fills the squash message from that
# commit, which under this convention is hidden: put the PR title there.
#
# ONE-TIME REPOSITORY SETTING, without which this workflow fails at the last
# step. The `permissions:` block below is necessary and not sufficient: there
# is a separate repository-level switch that forbids Actions from opening pull
# requests at all, and it is off by default.
#
#   Settings -> Actions -> General -> Workflow permissions
#   -> [x] Allow GitHub Actions to create and approve pull requests
#
# Until it is ticked, the run gets as far as committing the version bump and
# then dies with:
#
#   release-please failed: GitHub Actions is not permitted to create or
#   approve pull requests
#
# which reads like a bug in the token and is not one. It leaves the branch
# `release-please--branches--main--components--cairn` behind, already
# holding the correct commit; the next run after the setting is enabled opens
# the PR from it, so nothing is lost and nothing needs re-running by hand.
#
# Recorded here rather than in a runbook because this is where somebody will
# be looking when it happens.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing at the top: each job asks for what it uses. release-please-action is
# third-party code and gets contents and pull requests, never `actions:
# write`, so it cannot dispatch a workflow -- release.yml on a branch it
# pushed, say, which would run that branch's scripts with the signing secrets.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned by commit: this action holds a write token. v5.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  start-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # The dispatch below is what `actions: write` is for, and the only job
    # that holds it runs no third-party code.
    permissions:
      contents: write
      actions: write
    steps:

      # The step that makes a release have files in it.
      #
      # release-please creates the tag with this workflow's GITHUB_TOKEN, and
      # GitHub starts no workflow for anything that token does. Not `push`,
      # not `create`, not `release`: the rule is about who acted, not about
      # which event, and it exists so a workflow cannot trigger itself forever.
      # So `on: push: tags` in release.yml never fires for a tag cut here, and
      # never has -- the run history holds no tag push at all.
      #
      # This was misdiagnosed once already. #135 read the symptom as "tags made
      # through the API emit no push event" and added `on: create`, which is
      # suppressed by the same rule for the same reason. It then fired for
      # every *branch* anyone pushed, twenty-three times, skipped every one,
      # and never once saw a tag. v1.3.0 was the first release cut after it
      # landed, and shipped with no assets -- which also took down the
      # documented installer, because /releases/latest/download/install.sh
      # resolves against the newest release and that release had no install.sh.
      #
      # `workflow_dispatch` is one of the two events exempt from the rule, the
      # other being `repository_dispatch`. Dispatching at the tag makes
      # `github.ref` the tag, so release.yml behaves exactly as it would for a
      # tag push, and it is the same thing a maintainer was doing by hand. The
      # tag's own copy of release.yml is what runs, which is the right one: it
      # is the workflow that was reviewed alongside the code it builds.
      #
      # The alternative is handing release-please a personal access token, so
      # that its tag push counts as a person's. That works, and puts a
      # long-lived credential with write access in the repository's secrets to
      # save the six lines below.
      # Publish the draft as a prerelease -- one PATCH, so there is no moment
      # at which it is a published, non-pre release that the redirect would
      # pick up -- which also creates the tag, since GitHub cuts a draft's
      # tag only on publish. Then start the build on that tag. If the edit
      # fails, the draft stays a draft with no tag and no build: publish it
      # as a prerelease by hand and dispatch release.yml on the tag.
      - name: publish the draft as a prerelease and start the release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
