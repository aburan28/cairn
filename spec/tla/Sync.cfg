\* Three peers, one of them willing to forge bucket digests; four records, one
\* of which is derived and exists only to be pushed at somebody.
\*
\* Two buckets rather than the implementation's 256. The bucket count is a
\* message-size optimisation -- it decides how much of the id space one round
\* trip covers -- and nothing here depends on how many there are, only on the
\* fact that a bucket is exchanged when its digests differ and skipped when
\* they match. Two is the smallest number that has both a concealed and an
\* unconcealed bucket in the same run.
\*
\* `lies` is chosen once in the initial state rather than toggled during the
\* run, so TLC covers all four subsets of the buckets as four separate
\* behaviours. A digest forged and then withdrawn mid-sync is a strictly weaker
\* attack than one held for the whole run, so nothing is lost.
CONSTANTS
    Peers = {"p1", "p2", "evil"}
    Evil = "evil"
    Records = {"r1", "r2", "r3", "d1"}
    Buckets = {0, 1}
    Kind <- KindI
    Bucket <- BucketI
    Initial <- InitialI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnlyInputsAreHeld
    NoRecordsAppearFromNowhere
    ConcealmentIsSymmetric

PROPERTIES
    NoUnsolicitedAdmission
    HonestPeersConverge
