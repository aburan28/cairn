\* Space = 16 rather than the implementation's 2^32.
\*
\* The tiling property is about `step = Space \div partitions` truncating and the
\* last slice absorbing what is left over. Nothing in that argument scales with
\* the size of the space -- what matters is having partition counts that divide
\* it and partition counts that do not. With Space = 16, counts 3, 5 and 7 leave
\* remainders of 1, 1 and 2, which is the case the remainder absorption exists
\* for; 2^32 would add four billion points to quantify over and no new case.
\*
\* PartitionCounts covers 1 (the degenerate single slice that must still be the
\* whole space), 2 and 4 (exact divisors), and 3, 5, 7 (inexact). 16 is included
\* so that the count equals the space and every slice is a single point.
\*
\* Partitions = 3 is the count the running behaviour uses -- an inexact divisor,
\* so the assignments the state machine publishes are drawn against a partition
\* layout that actually needs the remainder rule. The arithmetic properties
\* quantify over all of PartitionCounts regardless of this.
\*
\* Times and EpochSeconds = 5: the range spans four epoch boundaries, which is
\* enough to check contiguity at a boundary and monotonicity across several.
CONSTANTS
    Nodes = {"n1", "n2"}
    Objectives = {"o1", "o2"}
    Space = 16
    PartitionCounts = {1, 2, 3, 4, 5, 7, 16}
    Partitions = 3
    Epochs = {0, 1, 2}
    EpochSeconds = 5
    Times = {0, 1, 4, 5, 6, 9, 10, 11, 14, 15, 19, 20}
    Draw <- DrawI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    SlicesTile
    MalformedCoversNothing
    AssignmentInRange
    PublishedAssignmentsStayVerifiable
    AssignmentsCannotBeReplayed
    EpochsAreMonotone
    EpochsAreContiguous
