\* MaxLen is 3 rather than Ledger's 4 because the reader's log ranges freely
\* over every well-formed chain, so the state space is quadratic in the number
\* of chains. Three entries is still enough for every case the reader's check
\* distinguishes: a fragment strictly shorter than `height`, a prefix exactly
\* at `height`, an extension beyond it, and a fork that agrees on a proper
\* prefix and then diverges.
CONSTANTS
    Payloads = {"p1", "p2"}
    MaxLen = 3
    RootKey = "k_operator"
    EveKey = "k_eve"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AcceptIffPrefixMatches
    ShortFragmentIsRefused
    RollbackIsDetected
    ForgedCheckpointIsRefused
