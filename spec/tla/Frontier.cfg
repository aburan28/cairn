\* Reward 10 over a span of 6 is chosen so truncation is visible rather than
\* incidental: cumulative runs 0, 1, 3, 5, 6, 8, 10, so five of the six unit
\* steps lose a fraction and the telescoping property is checking that the
\* losses cancel. A reward divisible by the span would pass for the wrong
\* reason.
\*
\* MaxSubmissions = 6 is the length of the longest interesting path -- six
\* single-unit steps from baseline to target. A longer bound only adds
\* submissions that cannot improve anything, since the frontier is monotone and
\* already at the target.
\*
\* MinImprovement = 2 rather than the default 1, because 1 admits every step and
\* would leave the interaction between the bar and the payout curve unexercised.
\* With 2, some improvements are refused mid-path and the telescoping identity
\* has to survive the gaps. The instance was also run at 1 and at 3; see
\* spec/tla/README.md.
CONSTANTS
    Artifacts = {"a1", "a2", "a3", "a4", "a5", "a6", "dup3"}
    Baseline = 0
    Target = 6
    Reward = 10
    Direction = "maximize"
    MinImprovement = 2
    MaxSubmissions = 6
    Score <- ScoreI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Telescopes
    PoolIsBounded
    PoolExhaustedAtTarget
    NoDoublePay
    CopyingEarnsZero

PROPERTIES
    Monotone
