\* Five candidates, two islands (3 + 2), K = 2, three nodes.
\*
\* The 3-candidate island is where pruning actually discards, so it is where
\* confluence could fail; the 2-candidate island is the control that catches a
\* prune dropping something it should have kept. K = 2 rather than 1 because
\* K = 1 makes "the top K" a maximum, and a maximum is confluent under almost
\* any rule -- the interesting failures need a set with an inside and an edge.
\*
\* Three nodes rather than the two that gossip strictly needs. Two converges
\* whenever a single pair does, which is not much of a test of *pairwise*
\* convergence; with three there are paths where a candidate reaches its final
\* holder only by way of a node that had already pruned it. It costs 4 seconds.
\*
\* The algebraic laws quantify over all 32 subsets, so associativity alone is
\* 32768 merges. That is affordable only because PruneTable is a constant-level
\* definition TLC evaluates once; raising the candidate count to 6 makes it
\* 262144 and the run stops fitting the two-minute budget.
CONSTANTS
    Nodes = {"n1", "n2", "n3"}
    Candidates = {"x1", "x2", "x3", "x4", "x5"}
    Islands = {0, 1}
    Capacity = 2
    Island <- IslandI
    Rank <- RankI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    MergeCommutes
    MergeAssociates
    MergeIdempotent
    PruningNeverChangesTheAnswer
    BoundedMemory
    NoGoodCandidateIsLost

PROPERTIES
    Converges
