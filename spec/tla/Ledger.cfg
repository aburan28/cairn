\* Two distinct payloads is the smallest domain in which "the content changed"
\* is expressible at all; a third adds states and no new shape of attack, since
\* every check compares for equality and never for order.
\*
\* Four entries is the smallest length at which every adversarial action has a
\* case the others do not cover: a middle delete needs an entry with a
\* predecessor and a successor, a swap needs two interior entries, and a
\* truncation needs somewhere to truncate to that is neither empty nor full.
CONSTANTS
    Payloads = {"p1", "p2"}
    MaxLen = 4

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ChainIntegrity
    DetectedSomehow
    RepairedRewriteMovesHead
    RootPinsWellFormedLogs

PROPERTIES
    AppendOnly
