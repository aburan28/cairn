\* Three claims with three distinct submitters. Three is the smallest log in
\* which a cycle can be longer than a self-loop, so the ancestor filter is
\* tested on a real cycle rather than on the degenerate case, and it is the
\* smallest in which a claim can cite two others and exercise the remainder
\* rule for an uneven split.
\*
\* delta = 1/2 and MaxDepth = 2 rather than the shipped defaults of 1/4 and 6.
\* The defaults do not reach the depth cutoff at this log size: a quarter of a
\* small amount truncates to zero after one hop, so the walk stops for lack of
\* money rather than for depth and the cutoff is never exercised. Halving
\* reaches depth 2 with units still in play. The instance was also run at the
\* real defaults (1/4, depth 6) and at delta = 1/1, which is the boundary case
\* where a claim passes on everything it received; see spec/tla/README.md.
\*
\* Amounts: 0 pays nobody at all rather than paying zeros; 7 divides unevenly at
\* every hop, so the odd unit is in play the whole way down; 12 divides evenly
\* by 2 twice and then unevenly by 3. Conservation is only interesting where the
\* division is not exact.
\*
\* MaxRewires = 2 lets the adversary build a two-claim cycle, which is the
\* shortest cycle the ancestor filter has to survive that is not a self-loop.
CONSTANTS
    ClaimIds = {"c1", "c2", "c3"}
    Submitters = {"s1", "s2", "s3"}
    DeltaNum = 1
    DeltaDen = 2
    MaxDepth = 2
    Amounts = {0, 7, 12}
    MaxRewires = 2
    Submitter <- SubmitterI
    Idx <- IdxI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HonestCitationsAreAcyclic
    Conserves
    NoNegativePayouts
    DecayIsBounded
    SubmitterKeepsAShare
