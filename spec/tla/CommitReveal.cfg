\* Two agents and three artifacts is the smallest instance in which the attack
\* is expressible *and* the ordering rule has something to order:
\*
\*   a1  alice's own work -- the thing worth copying
\*   a2  eve's own work   -- so an epoch can contain two unrelated reveals and
\*                          the beacon ordering is actually exercised
\*   d1  derived from a1  -- eve's front-run attempt
\*
\* Four epochs (0..3) is one more than the attack needs: eve must observe a1's
\* reveal, commit in the epoch after, and reveal in the epoch after that, so
\* three boundaries are required to reach a settled front-run at all. The extra
\* epoch is what lets TLC show that the ordering still holds once the attack
\* has fully played out rather than being cut off by the bound.
\*
\* Six keys is the smallest universe in which every submitter's alternatives
\* stay distinct from every other's committed key, so a rank collision in a
\* counterexample would be a real inversion and not an artefact of crowding.
\* `Rank(e, k) = (k + e) % 6` is injective in the key at every epoch.
\*
\* OrderKey = "commitment" is what src/node.rs ships. Flipping it to "claim"
\* is the falsification run: see docs/formal-model.md.
CONSTANTS
    Agents = {"alice", "eve"}
    Artifacts = {"a1", "a2", "d1"}
    NoBase = "none"
    Keys = {0, 1, 2, 3, 4, 5}
    MaxEpoch = 3
    EpochBatched = TRUE
    OrderKey = "commitment"
    Owner <- OwnerI
    Base <- BaseI
    AgentIx <- AgentIxI
    ArtIx <- ArtIxI
    CommitKey <- CommitKeyI
    ClaimKeys <- ClaimKeysI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Binding
    NoFrontRunning
    SettlementIsBeaconOrdered
    NothingToGrind
    OrderIsNotSubmitterChosen
    NoDoubleSettlement

PROPERTIES
    EveryRevealSettles
