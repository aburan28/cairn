\* Two nodes is the minimum for "two honest nodes agree" to say anything, and
\* the two of them carry different unpinned seeds so that turning SeedPinned off
\* is observable. Two artifacts: one that clears the threshold under every seed,
\* one that is seed-sensitive and rejects under the pinned seed.
\*
\* MaxDisruptions = 3 lets the adversary take both nodes down *and* tamper with
\* the pin in the same behaviour, which is the only combination in which the
\* order of the two failure checks in Status() is observable on a node that is
\* itself offline. Raising it explores longer outage/recovery cycles and finds
\* nothing new: up[] and specOk are booleans, so a longer cycle revisits
\* conditions the shorter ones already covered.
CONSTANTS
    Nodes = {"n1", "n2"}
    Artifacts = {"good", "seedy"}
    Seeds = {0, 1}
    PinnedSeed = 0
    Threshold = 0
    SeedPinned = TRUE
    MaxDisruptions = 3
    Score <- ScoreI
    NodeSeed <- NodeSeedI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NonSettlingNeverCloses
    OutageIsNeverRejection
    TamperedPinIsInvalidSpec
    HonestNodesAgree

PROPERTIES
    OutageIsRecoverable
