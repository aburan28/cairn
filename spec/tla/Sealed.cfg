\* Three seats with a threshold of two, against the shipped five and three.
\*
\* The properties here are structural rather than numeric -- binding, secrecy
\* below the threshold, liveness above it, seat binding, the epoch gate -- and
\* 2-of-3 is the smallest instance in which every one of them is expressible:
\*
\*   t = 2      one share is below the threshold and two are at it, so
\*              "t-1 does not open it slowly, it does not open it" has both
\*              sides present
\*   n = 3      leaves n - t + 1 = 2, so the withholding attack is a strict
\*              subset of the committee rather than all of it -- at n = 2 the
\*              two sides of the vice would coincide and neither would be
\*              distinguishable from "the committee refused"
\*
\* Raising this to the shipped 3-of-5 produces more instances of cases already
\* covered here and multiplies the share space by 2^2. What it would *not* buy
\* is the economic window in docs/diagrams.md §6, which is numeric, is about
\* what a seat is worth against what a bribe is worth, and is not a question a
\* model checker answers at any size.
\*
\* Two agents, because a transplant needs a donor: with one submission in the
\* log there is no other envelope to lift. Two artifacts, because a dishonest
\* sealer needs something else to seal.
\*
\* MaxEpoch = 1 is the least that tests the epoch gate rather than satisfying it
\* by accident: sealing happens at epoch 0, a share at epoch 0 is the thing the
\* gate must refuse, and a share at epoch 1 is the thing it must admit. Both
\* sides present, neither reachable only by widening the bound. A third epoch
\* adds later moments at which the same two cases recur and cost 26x the
\* states -- measured, not guessed.
\*
\* One liar is seated, deliberately. A committee with no adversary in it makes
\* the liveness property a statement about a cooperative world: `m3` answers
\* its seat with garbage, which also *consumes* the seat, so a run in which
\* `EventuallyOpens` holds is a run in which `m1` and `m2` alone carried the
\* reveal -- exactly `t` of them, with no margin.
\*
\* Colluders is empty here because at 2-of-3 a capture large enough to read
\* early (2 seats) leaves only 1 honest seat, and liveness would go vacuous.
\* The two vice runs -- t colluders reading early, n-t+1 withholding -- are
\* falsifications rather than this configuration; see docs/formal-model.md.
CONSTANTS
    Agents = {"alice", "bob"}
    Artifacts = {"a1", "a2"}
    Members = {"m1", "m2", "m3"}
    Seats = {1, 2, 3}
    Threshold = 2
    Liars = {"m3"}
    Colluders = {}
    MaxEpoch = 1
    BindingChecked = TRUE
    AadBound = TRUE
    SeatBound = TRUE
    EpochGated = TRUE
    Holder <- HolderI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OpenedMatchesItsCommitment
    NoOpenBelowThreshold
    NoSeatImpostor
    NoShareInCommitEpoch
    NoEarlyLeakWithoutCapture
    NothingLeaks
    NoDoubleOpen

PROPERTIES
    EventuallyOpens
