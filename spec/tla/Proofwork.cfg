\* Four claims across two epochs against one objective's pool.
\*
\* One objective, not several: the pool is per objective, so a second one adds
\* an independent copy of every property and no interaction. The interesting
\* interactions are all inside a single ratchet -- verdict, improvement,
\* citation, beacon order -- and four claims is the smallest set carrying one
\* instance of each way to fail: k4 has a non-settling verdict, k3 improves but
\* does not cite the frontier holder, k2 does everything right, k1 opens.
\*
\* MaxEpoch = 1 because the claims live in epochs 0 and 1; a third epoch adds
\* states in which nothing can be posted.
\*
\* Reward 10 over a span of 6 keeps the truncating division visible, matching
\* Frontier.cfg so the two modules' arithmetic can be compared by eye.
\*
\* RequireMaximal = TRUE. With FALSE -- an audit that checks every settlement it
\* is shown but never asks what was left out -- TLC violates
\* SettlementIsUniquelyDetermined immediately: a prefix of the canonical
\* sequence passes, which is an operator quietly declining to pay somebody.
\* See docs/formal-model.md.
CONSTANTS
    Claims = {"k1", "k2", "k3", "k4"}
    Baseline = 0
    Target = 6
    Reward = 10
    MinImprovement = 1
    MaxEpoch = 1
    RequireMaximal = TRUE
    Ix <- IxI
    Ep <- EpI
    Score <- ScoreI
    Verdict <- VerdictI
    Cites <- CitesI

SPECIFICATION Spec

INVARIANTS
    TypeOK
    SettlementIsUniquelyDetermined
    CanonicalSequencePassesAudit
    PoolIsExactlyConserved
    NothingSettlesWithoutAccept
    EverySettlementCitesTheFrontier
