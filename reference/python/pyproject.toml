[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofwork"
version = "0.1.0"
description = "A verified-results research network: objectives with runnable verifiers, an auditable log, and citation-flow attribution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

# `proofwork-py`, not `proofwork`: `pip install -e .` and `cargo install` would
# otherwise race for the same name on PATH, and whoever installed second wins
# silently -- the Python CLI has a subset of the Rust subcommands, so the
# collision looks like a broken install rather than a name clash.
[project.scripts]
proofwork-py = "proofwork.cli:main"

[tool.setuptools.packages.find]
include = ["proofwork*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
